# Name of your application. Used to uniquely configure containers.
service: daisyui-docs

# Name of the container image.
image: mhenrixon/daisyui-docs

# Deploy to the OSS docs server (oss-docs, provisioned by oss-infrastructure).
# Host and domain come from the GitHub `docs` environment secrets at deploy time.
servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>

# The server is accessed over SSH as the unprivileged "oss" user (not root);
# Docker runs via the docker group for that user.
ssh:
  user: oss

# kamal-proxy routes by Host header. The Cloudflare Tunnel (cloudflared on the
# server) terminates TLS at the edge and forwards http://localhost:80 ->
# kamal-proxy -> this container, so ssl is disabled here.
proxy:
  ssl: false
  host: <%= ENV["DEPLOY_DOMAIN"] %>
  app_port: 3000
  healthcheck:
    path: /up
    interval: 5
    timeout: 60

# Credentials for your image host.
registry:
  server: ghcr.io
  username: mhenrixon
  password:
    - KAMAL_REGISTRY_PASSWORD

# Builder uses repo root as context so path gem dependency resolves.
builder:
  arch: amd64
  remote: false
  # Run kamal from docs/. The build context is the repo root (..) so the
  # path gem dependency `gem "daisyui", path: ".."` resolves; the dockerfile
  # path is relative to the working dir (docs/), i.e. docs/Dockerfile.
  context: ..
  dockerfile: Dockerfile
  cache:
    type: registry
    options: mode=max,image-manifest=true,oci-mediatypes=true

# Inject ENV variables into containers. The docs app uses no encrypted Rails
# credentials, so it needs no RAILS_MASTER_KEY / app secrets here.
env:
  clear:
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"

# Persist SQLite database.
volumes:
  - "daisyui_docs_data:/data"

# Configure boot options.
boot:
  limit: 1
  wait: 30

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# temporary errors during deploy.
asset_path: /gem/docs/public/assets
