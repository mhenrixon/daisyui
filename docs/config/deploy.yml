# Name of your application. Used to uniquely configure containers.
service: daisyui-docs

# Name of the container image.
image: mhenrixon/daisyui-docs

# Deploy to the OSS docs server.
servers:
  web:
    hosts:
      - <%= ENV["DEPLOY_HOST"] %>

# kamal-proxy handles routing by Host header.
# Cloudflare Tunnel terminates TLS at the edge, then forwards
# http://localhost:80 -> kamal-proxy -> this container.
proxy:
  ssl: false
  host: <%= ENV["DEPLOY_DOMAIN"] %>
  app_port: 3000
  healthcheck:
    path: /up
    interval: 5
    timeout: 60

# Credentials for your image host.
registry:
  server: ghcr.io
  username: mhenrixon
  password:
    - KAMAL_REGISTRY_PASSWORD

# Builder uses repo root as context so path gem dependency resolves.
builder:
  arch: amd64
  remote: false
  context: ..
  dockerfile: docs/Dockerfile
  cache:
    type: registry
    options: mode=max,image-manifest=true,oci-mediatypes=true

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    RAILS_SERVE_STATIC_FILES: "true"
    RAILS_LOG_TO_STDOUT: "true"
  secret:
    - RAILS_MASTER_KEY

# Persist SQLite database.
volumes:
  - "daisyui_docs_data:/data"

# Configure boot options.
boot:
  limit: 1
  wait: 30

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# temporary errors during deploy.
asset_path: /gem/docs/public/assets
