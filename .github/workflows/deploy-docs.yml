name: Deploy Docs

# Deploys the docs site (docs/) to the oss-infrastructure server via Kamal when a
# release is published, or on demand. The build+deploy logic is shared across all
# docs-kit sites — see mhenrixon/docs-kit/.github/workflows/deploy.yml.
on:
  release:
    types: [published]
  workflow_dispatch:

# The caller must GRANT packages: write — a reusable workflow can only narrow the
# permissions it's given, never escalate. With the repo default of read-only, the
# build job's packages: write would exceed the grant → startup_failure.
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: mhenrixon/docs-kit/.github/workflows/deploy.yml@main
    with:
      image: mhenrixon/daisyui
      service: daisyui
    secrets: inherit
